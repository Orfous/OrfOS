[[icedos.repositories]]
url = "github:icedos/desktop"

[icedos.desktop]
keyboardLayouts = [ "us", "gr" ]

[icedos.desktop.applications.browser]
name = "helium.desktop"

[icedos.desktop.applications.editor]
name = "dev.zed.Zed.desktop"

[icedos.desktop.applications.files]
name = "org.gnome.Nautilus.desktop"

[icedos.desktop.applications.torrent]
name = "org.qbittorrent.qBittorrent.desktop"
package = "qbittorrent"

[icedos.desktop.clock]
date = true
weekday = true

[[icedos.desktop.entries]]
id = "librewolf" # Firefox privacy flavor
name = "Librewolf"
exec = "icedos pkgs run librewolf"
icon = "librewolf"

[[icedos.desktop.entries]]
id = "mousai" # Song recognizer
name = "Mousai"
exec = "icedos pkgs run mousai"
icon = "mousai"

[[icedos.desktop.entries]]
id = "newsflash" # RSS reader
name = "Newsflash"
exec = "icedos pkgs run newsflash"
icon = "newsflash"

[[icedos.desktop.entries]]
id = "powertop"
name = "Powertop"
exec = "sh -c \"printf 'layout tall\\nlaunch run0 btop\\nlaunch icedos pkgs run nvtopPackages.amd\\n' | kitty --session -\""
icon = "terminal"

[[icedos.repositories]]
url = "github:icedos/kde"
fetchOptionalDependencies = true

[icedos.desktop.kde]
excludeDefaultPackages = ["dolphin", "dolphin-plugins"]

[icedos.desktop.kde.keyboard]
switchingPolicy = "window"

[icedos.desktop.kde.panel]
autohide = true

[icedos.desktop.kde.panel.system-tray]
disabledApplets = [
  "org.kde.plasma.devicenotifier",
  "org.kde.plasma.mediacontroller"
]

[[icedos.desktop.kde.screen-edges]]
position = "topLeft"
action = "none"

[icedos.desktop.kde.shortcuts.hotkeys.kitty]
name = "Kitty"
command = "kitty"
keys = ["Meta+X", "Meta+Χ"]

[icedos.desktop.kde.shortcuts.hotkeys.nautilus]
name = "Nautilus"
command = "nautilus"
keys = ["Meta+E", "Meta+Ε"]

[icedos.desktop.kde.session]
restorePrevious = true

[icedos.desktop.stylix]
disabledTargets = ["blender", "chromium", "console", "kmscon", "vencord", "zed"]

[icedos.desktop.users.orfous]
startupScript = "protonvpn-app"

[icedos.desktop.users.orfous.idle.lock]
enable = false

[icedos.desktop.users.orfous.idle.disable-monitors]
seconds = 300

[icedos.desktop.users.orfous.idle.suspend]
enable = false

[icedos.desktop.windows]
minimizeButton = true

[icedos.desktop.xdg-desktop-portal]
forceGtkFilePicker = true

[[icedos.repositories]]
url = "github:icedos/hardware"
modules = [
  "bluetooth",
  "disable-ipv6",
  "graphics",
  "kernel",
  "monitors",
  "mounts",
  "pipewire",
  "radeon",
  "ryzen",
  "scx",
  "uinput",
  "upower",
  "zenergy",
]

[icedos.hardware.graphics.radeon]
featureMask = "0xffffffff"

[icedos.hardware.kernel]
variant = "latest"

[icedos.hardware.kernel.scx]
scheduler = "lavd"
extraArgs = ["--performance"]

[[icedos.hardware.mounts]]
path = "/"
device = "/dev/disk/by-uuid/2d2507f5-9d13-4580-9b63-7847206f17bb"
fsType = "btrfs"
flags = ["compress=zstd", "nofail", "x-gvfs-show"]

[[icedos.hardware.mounts]]
path = "/mnt/Games"
device = "/dev/disk/by-uuid/99d9fc7b-2a21-42da-a05e-1f5881bb5081"
fsType = "btrfs"
flags = ["compress=zstd", "nofail", "x-gvfs-show"]

[[icedos.hardware.mounts]]
path = "/mnt/Harder Drive"
device = "/dev/disk/by-uuid/0b17e5e9-a2f1-4350-b0e9-740187d016ce"
fsType = "btrfs"
flags = ["compress=zstd", "nofail", "x-gvfs-show"]

[icedos.hardware.network]
firewall = false

[icedos.hardware.pipewire.echo-cancellation]
enable = true

[icedos.hardware.pipewire.noise-cancellation]
enable = true
# true  = smart filter on the default mic (transparent, follows default source)
# false = separate virtual mic that apps must explicitly select
dynamic = true
# true  = 1-channel rnnoise (mono mics native; stereo mics downmixed to mono)
# false = 2-channel rnnoise (stereo mics preserved; mono mics upmixed, ~2x CPU)
mono = false
# How confident (%) rnnoise must be that a sound is speech before letting it through
vadThreshold = 90
# Ms to keep the gate open after speech stops, preventing abrupt mid-sentence cutoffs
vadGracePeriod = 400
# Ms of audio to retroactively restore when speech is detected, catching clipped first syllables
retroactiveVadGrace = 100

[[icedos.repositories]]
url = "github:icedos/virtualisation"
modules = ["podman"]

[[icedos.repositories]]
url = "github:icedos/gaming"
modules = [
  "aagl",
  "gamemode",
  "gamescope",
  "lsfg-vk",
  "mangohud",
  "proton-launch",
]

[icedos.gaming.aagl]
launchers = ["anime-game-launcher"]

[icedos.users.orfous]
description = "Orfous"

[icedos.system]
generations = 30
packages = [
  "android-tools",
  "appimage-run",
  "bottles", # not a bottles
  "ckan", # A KSP mod manager
  "claude-code",
  "discord",
  "faugus-launcher",
  "gimp3", # GNU Image Manipulation Program
  "gnome-calculator",
  "gsound", # Small library for playing system sounds (required to show file properties in Nautilus)
  # "handbrake", # Tool for converting video files and ripping DVDs
  "heroic",
  "jetbrains.webstorm", # IDE for Web, JavaScript and Typescript development
  "jq", # Lightweight and flexible command-line JSON processor
  "mission-center", # CPU, Memory, Disk, Network and GPU usage monitor
  "mousai", # Song recognizer
  "nodejs_22",
  "obsidian", # A note taking app
  "pavucontrol", # Sound manager
  "pnpm", # Fast, disk space efficient package manager for JavaScript
  "proton-vpn",
  "signal-desktop",
  "spotify", # A sound media streaming platform
  "stremio-linux-shell", # A media torrent aggregator
  "ungoogled-chromium", # Chromium with dependencies on Google web services removed
  "warp", # Send files via the automatically fastest route
]
permittedInsecurePackages = []
version = "25.11"

[icedos.system.bootloaders.systemd-boot]
mountPoint = "/boot"

[icedos.system.gc]
days = 10 # Number of days before a generation can be deleted
generations = 15 # Number of generations that will always be kept

[icedos.system.git.users.orfous]
username = "Orfous"
email = "orfous29@gmail.com"

[[icedos.system.overlays.from-channel]]
url = "github:nixos/nixpkgs/nixos-unstable-small"
packages = ["kdePackages"]

[icedos.system.zsh.aliases]
i = "icedos"
ir = "icedos rebuild"
iu = "icedos rebuild --update"
